name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore PatientBooking.App.slnx
      - run: dotnet build PatientBooking.App.slnx -c Release --no-restore
      # dotnet test intentionally omitted - no test project exists yet (see testing.md).
      # Add it here once xUnit + WebApplicationFactory + Testcontainers land.

      # Dokploy builds this same Dockerfile directly from the repo on deploy - no GHCR push here
      # anymore. Build it (unpushed) so a broken Dockerfile fails fast in CI instead of only
      # surfacing when Dokploy tries to deploy it.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
