# VPS deploy shape - a single Docker host running both containers, no orchestrator, no Azure
# dependency. Deployed via Dokploy (docs.dokploy.com) as a Docker Compose application - Dokploy
# builds the Dockerfile directly from this repo and manages the deploy. `docker compose up --build`
# still works unmodified for local dev.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - sqlserver-data:/var/opt/mssql
    # No host port mapping - the api service reaches this over the internal Compose network by
    # service name regardless, and exposing 1433 on a public VPS puts the sa login in reach of the
    # whole internet. For ad hoc SSMS/Azure Data Studio access, SSH-tunnel instead:
    # ssh -L 1433:localhost:1433 <user>@<vps-host>
    healthcheck:
      # mssql-tools18 (not mssql-tools) ships in this image as of SQL Server 2022 CU14 - the -C
      # flag trusts the server cert since ODBC 18 defaults to encrypted connections.
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    # No host port mapping, same reasoning as sqlserver above - the api service reaches this over
    # the internal Compose network by service name, and 5672/15672 never need to be public. For ad
    # hoc management-UI access, SSH-tunnel instead: ssh -L 15672:localhost:15672 <user>@<vps-host>,
    # then browse localhost:15672 - see docs/deployment.md.
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    # Dokploy builds this from the Dockerfile directly on deploy - no image to pull.
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      # service_healthy (not the default service_started) waits for the healthcheck above to pass
      # before starting the api container - SQL Server accepts the TCP connection well before it's
      # actually ready to serve queries, and Program.cs's admin-seed block queries the database
      # eagerly at startup.
      sqlserver:
        condition: service_healthy
      # Deliberately service_started, not service_healthy - the whole point of the outbox pattern
      # (BookingOutboxDispatcher) is that the api must start and keep serving requests even if the
      # broker isn't up yet. A booking still saves; its confirmation just waits in the outbox.
      rabbitmq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__PatientBookingDbConnectionString: "Server=sqlserver,1433;Database=PatientBookingDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      JwtSettings__Key: ${JWT_SETTINGS_KEY}
      LookupProtection__Key: ${LOOKUP_PROTECTION_KEY}
      EmailSettings__SmtpHost: ${EMAIL_SETTINGS_SMTP_HOST}
      EmailSettings__SmtpPort: ${EMAIL_SETTINGS_SMTP_PORT}
      EmailSettings__Username: ${EMAIL_SETTINGS_USERNAME}
      EmailSettings__Password: ${EMAIL_SETTINGS_PASSWORD}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID}
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      RabbitMq__VirtualHost: /
      # Optional: bootstrap one new admin account. Values come from Dokploy's .env.
      AdminSeed__Email: ${ADMIN_SEED_EMAIL:-}
      AdminSeed__Password: ${ADMIN_SEED_PASSWORD:-}
      AdminSeed__FirstName: ${ADMIN_SEED_FIRST_NAME:-}
      AdminSeed__LastName: ${ADMIN_SEED_LAST_NAME:-}
    volumes:
      # Bind-mounted so Serilog's File sink (appsettings.Production.json) survives container
      # recreation instead of being lost with the container's writable layer.
      - ./Logs:/app/Logs
      # Preserve encryption keys across redeployments. Never delete this volume while
      # retaining user data; preserve any existing keys before the first deployment.
      - api-keys:/app/keys
    ports:
      # Dokploy's Traefik reaches this over its internal Docker network by service name (api:8080),
      # not through this mapping - it's here for local dev (`curl localhost:8080`). Safe in
      # production only as long as the VPS firewall doesn't allow inbound 8080; opening that port
      # would let traffic bypass Traefik's TLS entirely. Domain/HTTPS are configured in Dokploy's
      # UI (Domains tab), not here.
      - "8080:8080"
    networks:
      # "default" keeps this on the same Compose network as sqlserver; dokploy-network is what
      # lets Traefik actually reach this container to route api.industrialhinterlands.cloud to it.
      - default
      - dokploy-network

  # Normally run in Dokploy's api terminal: dotnet PatientBooking.Api.dll --migrate
  # This optional service supports manual migrations when the API cannot start.
  # Never starts on a normal `docker compose up` (excluded by the "tools" profile).
  # Use the same Compose project name and .env as the running Dokploy deployment.
  # docker compose -p patientbooking-api-qns9o0 --env-file .env -f ./docker-compose.yml run --build --rm migrator
  migrator:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      # Migration mode builds the application host and resolves the DbContext, so it needs the
      # same connection string, JWT key, and lookup-protection key as the API.
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__PatientBookingDbConnectionString: "Server=sqlserver,1433;Database=PatientBookingDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      JwtSettings__Key: ${JWT_SETTINGS_KEY}
      LookupProtection__Key: ${LOOKUP_PROTECTION_KEY}
    entrypoint:
      - dotnet
      - PatientBooking.Api.dll
      - --migrate

volumes:
  sqlserver-data:
  api-keys:
  rabbitmq-data:

networks:
  dokploy-network:
    external: true
